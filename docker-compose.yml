services:
  postgres-shard1:
    image: postgres:16
    container_name: wallet-shard1
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet-shard1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - wallet_shard1_data:/var/lib/postgresql/data

  postgres-shard2:
    image: postgres:16
    container_name: wallet-shard2
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet-shard2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - wallet_shard2_data:/var/lib/postgresql/data

volumes:
  wallet_shard1_data:
  wallet_shard2_data:
